name: Sakura stats

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/**
      - .github/workflows/sakura-stats.yml

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch GitHub stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -f login="${{ github.repository_owner }}" -f query='
            query($login: String!) {
              user(login: $login) {
                repositories(ownerAffiliations: OWNER, isFork: false, first: 100) {
                  totalCount
                  nodes {
                    stargazerCount
                    languages(first: 10, orderBy: {field: SIZE, direction: DESC}) {
                      edges { size node { name } }
                    }
                  }
                }
                contributionsCollection {
                  totalCommitContributions
                  restrictedContributionsCount
                  contributionCalendar { totalContributions }
                }
                pullRequests { totalCount }
                issues { totalCount }
              }
            }' > stats.json
          jq -r -f scripts/stats.jq stats.json > stats.properties
          cat stats.properties

      - name: Render sakura card
        run: java scripts/SakuraStats.java stats.properties assets/stats.svg

      - name: Commit card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --cached --quiet || git commit -m "Update sakura stats"
          git push
