name: Profile theme and stats

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - theme.properties
      - "**.tpl"
      - scripts/**
      - .github/workflows/sakura-stats.yml

concurrency:
  group: profile-theme
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    env:
      # STATS_TOKEN is a personal access token saved in Settings > Secrets > Actions.
      # Without it the workflow still runs, but only counts public data.
      TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Apply theme.properties colors
        run: |
          java scripts/ApplyTheme.java
          java scripts/ApplyTheme.java export >> "$GITHUB_ENV"

      - name: Fetch GitHub stats
        env:
          GH_TOKEN: ${{ env.TOKEN }}
        run: |
          gh api graphql -f login="${{ github.repository_owner }}" -f query='
            query($login: String!) {
              user(login: $login) {
                repositories(ownerAffiliations: OWNER, isFork: false, first: 100) {
                  nodes { stargazerCount }
                }
                all: repositories(ownerAffiliations: [OWNER, COLLABORATOR, ORGANIZATION_MEMBER], isFork: false, first: 100) {
                  totalCount
                  nodes {
                    languages(first: 10, orderBy: {field: SIZE, direction: DESC}) {
                      edges { size node { name } }
                    }
                  }
                }
                contributionsCollection {
                  totalCommitContributions
                  restrictedContributionsCount
                  contributionCalendar { totalContributions }
                }
                pullRequests { totalCount }
                issues { totalCount }
              }
            }' > stats.json
          jq -r -f scripts/stats.jq stats.json > stats.properties
          cat stats.properties

      - name: Render stats cards
        run: java scripts/SakuraStats.java stats.properties assets/stats.svg assets/languages.svg

      - name: Classic GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          path: assets/github-stats.svg
          token: ${{ env.TOKEN }}
          options: username=${{ github.repository_owner }}&show_icons=true&count_private=true&include_all_commits=true&rank_icon=github&hide_border=true&bg_color=${{ env.BG_HEX }}&title_color=${{ env.MAIN_HEX }}&icon_color=${{ env.LIGHT_HEX }}&text_color=${{ env.SOFT_HEX }}&ring_color=${{ env.MAIN_HEX }}&custom_title=GitHub%20stats

      - name: Commit themed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git diff --cached --quiet && exit 0
          git commit -m "Apply theme and update stats cards"
          git pull --rebase
          git push
