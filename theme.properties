# Profile theme - change a color here, push, and the
# "Profile theme" workflow re-colors the README and every card.
# Values are CSS color names (dodgerblue, crimson, ...) or hex (1e90ff).

THEME_NAME=Ocean

# main accent: headings, borders, petals
MAIN=dodgerblue
# stronger accent: gradients, rules
STRONG=royalblue
# light accent: numbers, highlights
LIGHT=lightskyblue
# soft accent: labels
SOFT=lightblue
# body text on cards
TEXT=aliceblue
# muted text: dates, footnotes
MUTED=cornflowerblue
# glow behind cards and the footer wave
GLOW=midnightblue
# extra accents
ACCENT=steelblue
PALE=lightsteelblue
DIM=slategray
# card background
BG=black

# colors for the language bars and donut, in order
LANGS=royalblue,dodgerblue,steelblue,lightskyblue,cornflowerblue,lightblue,deepskyblue,lightsteelblue
