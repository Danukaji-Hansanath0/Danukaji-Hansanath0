<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 70" width="960" height="70">
  <defs>
    <linearGradient id="ink" x1="0" x2="1">
      <stop offset="0" stop-color="dodgerblue"/>
      <stop offset="1" stop-color="lightskyblue"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" x2="1">
      <stop offset="0" stop-color="royalblue"/>
      <stop offset="0.6" stop-color="dodgerblue" stop-opacity="0.35"/>
      <stop offset="1" stop-color="dodgerblue" stop-opacity="0"/>
    </linearGradient>
    <path id="hp" d="M0 0C-12-6-11-19-3-21L0-17L3-21C11-19 12-6 0 0Z"/>
  </defs>
  <style>
    .drift { animation: drift linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes drift {
      0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      15%  { opacity: 0.9; }
      85%  { opacity: 0.9; }
      100% { transform: translate(620px, 10px) rotate(540deg); opacity: 0; }
    }
  </style>
  <g transform="translate(4 6) scale(0.95)">
  <defs>
    <linearGradient id="ig" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="lightskyblue"/>
      <stop offset="1" stop-color="royalblue"/>
    </linearGradient>
  </defs>
  <style>
    .beat { animation: beat 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes beat { 0%, 100% { transform: scale(0.9); } 20% { transform: scale(1.05); } 40% { transform: scale(0.95); } }
  </style>
  <g class="beat">
    <path d="M24 41C10 31 5 23 7 16C9 9 18 7 24 14C30 7 39 9 41 16C43 23 38 31 24 41Z" fill="url(#ig)"/>
    <path d="M13 15C15 12 18 12 20 14" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  </g>
</g>
  <text x="66" y="44" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="url(#ink)">Connect</text>
  <rect x="0" y="62" width="960" height="2.5" rx="1.25" fill="url(#rule)"/>
  <g transform="translate(200 62) scale(0.4)" fill="dodgerblue"><use class="drift" href="#hp" xlink:href="#hp" style="animation-duration:11s;animation-delay:-3s"/></g>
  <g transform="translate(260 67) scale(0.3)" fill="lightskyblue"><use class="drift" href="#hp" xlink:href="#hp" style="animation-duration:15s;animation-delay:-9s"/></g>
</svg>
