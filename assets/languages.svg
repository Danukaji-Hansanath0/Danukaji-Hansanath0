          <circle r="70" fill="none" stroke="palevioletred" stroke-width="24" stroke-dasharray="21.5 418.3" stroke-dashoffset="-323.2"/>
          <circle r="70" fill="none" stroke="lightpink" stroke-width="24" stroke-dasharray="21.2 418.6" stroke-dashoffset="-346.7"/>
          <circle r="70" fill="none" stroke="mediumvioletred" stroke-width="24" stroke-dasharray="19.2 420.7" stroke-dashoffset="-370.0"/>
          <circle r="70" fill="none" stroke="pink" stroke-width="24" stroke-dasharray="16.7 423.2" stroke-dashoffset="-391.1"/>
          <circle r="70" fill="none" stroke="orchid" stroke-width="24" stroke-dasharray="13.2 426.6" stroke-dashoffset="-409.8"/>
          <circle r="70" fill="none" stroke="thistle" stroke-width="24" stroke-dasharray="12.8 427.0" stroke-dashoffset="-425.0"/>
      </g></g>
      <text y="-2" text-anchor="middle" font-size="22" font-weight="800" fill="url(#ink)">Java</text>
